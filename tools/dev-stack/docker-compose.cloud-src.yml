# 叠在 docker-compose.yml 上：云仓镜像改为从本地 armadra-cloud 克隆构建。
# 由 dev-stack.mjs 在设了 ARMADRA_DEV_STACK_CLOUD_SRC（或旁边有 ../armadra-cloud）时加 -f，
# 不单独使用。这里只覆盖 build 与 image；命令、环境、依赖与端口都以 docker-compose.yml 为准。
services:
  cloud:
    build:
      context: "${ARMADRA_DEV_STACK_CLOUD_SRC:?set ARMADRA_DEV_STACK_CLOUD_SRC}"
      dockerfile: go/Dockerfile.cloud
    image: armadra-dev-cloud:local

  migrate:
    build:
      context: "${ARMADRA_DEV_STACK_CLOUD_SRC:?set ARMADRA_DEV_STACK_CLOUD_SRC}"
      dockerfile: go/Dockerfile.cloud
    image: armadra-dev-cloud:local

  relay:
    build:
      context: "${ARMADRA_DEV_STACK_CLOUD_SRC:?set ARMADRA_DEV_STACK_CLOUD_SRC}"
      dockerfile: go/Dockerfile
    image: armadra-dev-relay:local

  relay-personal:
    build:
      context: "${ARMADRA_DEV_STACK_CLOUD_SRC:?set ARMADRA_DEV_STACK_CLOUD_SRC}"
      dockerfile: go/Dockerfile
    image: armadra-dev-relay:local
