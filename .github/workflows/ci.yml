# 作业矩阵见 docs/guides/ci-release.md。
#
# 一个矩阵作业跑三种 runner：同一串检查在 Linux、macOS 与 Windows 上各跑一遍，
# 因为这个仓库的平台差异不在前端而在 core——tmux 与 Unix socket 在 Windows 上
# 换成 ConPTY 与命名管道，只有真的在三个系统上跑过才知道换得对不对。平台相关
# 的用例在源码里按 `process.platform` 门控，CI 不做任何按名字过滤的测试排除：
# 一条在 Windows 上不该跑的用例，应该在 Windows 上压根不存在。
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: "12.21.0"
  NODE_VERSION: "24"
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  # 先判断改了什么（workspace#9）：只改文档（Markdown 与 docs/，契约与第三方声明
  # 除外）时只跑下面的 docs 作业，完整检查与端到端跳过；推到 main 同理。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: diff
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          code=false
          if [ -n "${BASE:-}" ] && ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || \
              git fetch --no-tags --unshallow origin 2>/dev/null || true
          fi
          if [ -z "${BASE:-}" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null || [ "$GITHUB_REF_TYPE" = tag ]; then
            code=true
          else
            files=$(git diff --name-only "$BASE" HEAD)
            [ -z "$files" ] && code=true
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                THIRD_PARTY_NOTICES.md | docs/contracts/*) code=true ;;
                *.md | docs/* | .github/ISSUE_TEMPLATE/*) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "只改文档：$([ $code = false ] && echo 是 || echo 否)"

  docs:
    needs: changes
    if: ${{ needs.changes.outputs.code != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION || 24 }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: pnpm repo:check

  check:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux-x86_64
          - runner: macos-15
            label: macos-aarch64
          - runner: windows-latest
            label: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      # core 的 Git 操作（merge / cherry-pick / amend）用仓库或全局配置里的
      # 身份提交；runner 两者都没有，Git 会在动树之前拒绝，测试就把它记成
      # unknownOutcome。开发机上是全局配置在兜底，这里也放一份全局配置——
      # 不用环境变量，因为 GIT_AUTHOR_* 会压过测试夹具自己 `-c user.name` 写的作者。
      - name: 给 Git 一个身份
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "Armadra CI"
          git config --global user.email "ci@armadra.invalid"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 缓存工具链增量产物（prettier / eslint / tsc）
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache
            apps/*/node_modules/.cache
            packages/*/node_modules/.cache
          key: check-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.base.json', '**/tsconfig*.json', 'eslint.config.js') }}-${{ github.sha }}
          restore-keys: |
            check-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.base.json', '**/tsconfig*.json', 'eslint.config.js') }}-
            check-cache-${{ runner.os }}-

      # Linux 跑 full（含契约、lint、画板预算、工作流结构与许可证扫描）；
      # macOS 与 Windows 跑 platform（换行、路径分隔符与平台相关脚本单测），
      # 跳过平台无关的纯 AST / 许可证重复扫描。
      - name: 静态检查与脚本自检（并行）
        run: node tools/ci/check-ci.mjs --mode ${{ runner.os == 'Linux' && 'full' || 'platform' }}

      # check-ci 已完成 libs:build 与 typecheck；先编一次页面产物，既给后面
      # production.test.ts 静态核对（省掉测试内二次 vite build），也给桌面壳复用。
      - name: 构建前端页面产物
        run: pnpm --filter @armadra/web run build:vite

      # web、shared、两种壳与桌面脚本的测试。这一步已经跑了 @armadra/desktop 的
      # `test`（vitest + `node --test scripts/*.test.mjs`），覆盖 core 的全部单测，
      # 以及 electron-builder.yml、entitlements、signing-electron.mjs、
      # after-pack.mjs 与产物矩阵一致性；不再重复一遍。
      # 覆盖率（工程规范化 §5）只在 Linux 上开、只出报告不设门槛：web、desktop、
      # server 三个 vitest 配置读 ARMADRA_COVERAGE，三平台不重复算。
      #
      # 各包逐个跑（--workspace-concurrency=1）。每个 vitest 自己就按核数开
      # worker；pnpm 缺省同时跑四个包，desktop 与 web 两套大测试叠在 3–4 核的
      # runner 上，每条用例的墙钟时间被拉长一倍以上：web 的 5 s 用例超时、
      # desktop 的 10 s 钩子超时、live 无头浏览器在后台标签页上等不到渲染进程，
      # 都出在两套同时跑的那段。总 CPU 工作量不变，逐个跑的总时长相近。
      - run: pnpm -r --workspace-concurrency=1 --if-present test
        env:
          ARMADRA_COVERAGE: ${{ runner.os == 'Linux' && '1' || '' }}
          ARMADRA_WEB_BUILT_DIST: ${{ github.workspace }}/apps/web/dist
      - name: 上传覆盖率报告
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: |
            apps/web/coverage/lcov.info
            apps/desktop/coverage/lcov.info
            apps/server/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
      - run: pnpm plugin:test

      # 桌面壳的 main/preload/core 等子包编译一遍并复用上面编好的页面产物，但不打包：
      # 打包（electron-builder）要平台特定的证书/公证输入，是发布流水线的事。
      # 这里要的是三个平台上 electron-vite 的构建图都过得去。
      - name: 桌面壳构建（不打包）
        env:
          ARMADRA_REUSE_WEB_DIST: "1"
        run: pnpm --filter @armadra/desktop build

      # Windows 首版明确不支持 controller transport；客户端的拒绝分支由上方
      # 单测与插件路径测试覆盖。Unix 真 socket/PTY/崩溃路径在两种 runner 上执行。
      - name: Unix controller 故障探针
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pnpm plugin:build
          node tools/probes/controller-smoke.mjs
          node tools/probes/controller-run.mjs
          node tools/probes/controller-run.mjs --cancel
          node tools/probes/controller-run.mjs --large-output
          node tools/probes/controller-run.mjs --crash
          node tools/probes/build-controller-fault.mjs
          node tools/probes/controller-run.mjs --fault=launch.before
          node tools/probes/controller-run.mjs --fault=launch.after
          node tools/probes/controller-run.mjs --fault=delivery.before
          node tools/probes/controller-run.mjs --fault=delivery.after
  # A 档端到端（docs/guides/ci-release.md §1.1）：tools/ci/e2e.d/ 里 tier a 的
  # 探针逐条跑——真 core、真页面、新 profile 的无头 Chrome、各自私有的 tmux
  # socket。只在 Linux 上跑：探针要 tmux，而三平台的差异已经由上面的单测守着。
  # 失败阻断合并；每条的 result.json、截图与输出作为产物上传。
  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: e2e (tier a, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "1/3"
            slug: "1-of-3"
          - shard: "2/3"
            slug: "2-of-3"
          - shard: "3/3"
            slug: "3-of-3"
    steps:
      - uses: actions/checkout@v4
      - name: 给 Git 一个身份
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "Armadra CI"
          git config --global user.email "ci@armadra.invalid"

      # Ubuntu 24.04 的 AppArmor 默认不许非特权用户命名空间，Chrome 的沙箱起不来；
      # 在一次性的 runner 上放开，而不是给探针加 --no-sandbox。
      # fonts-noto-cjk 只为截图里的中文不是方块，断言不看字形。
      - name: 装 tmux、xvfb 与中文字体，放开用户命名空间
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux xvfb fonts-noto-cjk
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          tmux -V

      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 构建探针要的产物
        shell: bash
        run: |
          set -euo pipefail
          pnpm libs:build
          # 页面、服务器壳、推送中继与 Linux Node ABI 的 node-pty 互不依赖，并行构建；
          # 桌面壳随后直接复用编好的 apps/web/dist。
          pids=()
          pnpm --filter @armadra/web run build:vite & pids+=($!)
          pnpm --filter @armadra/server build & pids+=($!)
          pnpm --filter @armadra/push-relay build & pids+=($!)
          node apps/desktop/scripts/ensure-node-pty.mjs & pids+=($!)
          for pid in "${pids[@]}"; do
            wait "$pid"
          done
          ARMADRA_REUSE_WEB_DIST=1 pnpm --filter @armadra/desktop build

      - name: A 档端到端
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: xvfb-run -a node tools/ci/e2e.mjs --tier a --shard "${{ matrix.shard }}" --out target/e2e/a

      - name: 上传端到端产物
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tier-a-${{ matrix.slug }}
          path: target/e2e/a
          if-no-files-found: ignore
          retention-days: 14
